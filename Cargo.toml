[workspace]
resolver = "3"
members = ["crates/vc-kernel", "crates/vc-select", "crates/vc-query", "crates/vc-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jquezada19/velocity-code"

[workspace.dependencies]
blake3 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
tempfile = "3"
proptest = "1"
assert_cmd = "2"
tree-sitter = "0.26.13"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
ast-grep-core = "0.45.2"
memchr = "2.8.3"
regex = "1.13.1"
