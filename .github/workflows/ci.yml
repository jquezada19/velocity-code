name: ci
on:
  push: { branches: [main] }
  pull_request:

# Least privilege by default. Nothing here writes to the repo, opens a PR,
# publishes a package, or posts a status — a read-only token is all any job
# needs, and a job that later does need more has to say so itself rather
# than inheriting a write token it never asked for.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs, not tags. A tag
      # is a mutable pointer the action's owner can move at any time, so
      # `@v4` means "whatever that repo calls v4 the next time this runs" —
      # a supply-chain hole in a workflow that checks out the repo and runs
      # a build. The comment records which release each SHA was, so the pin
      # can be read and bumped deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinning by SHA loses the ref name this action normally reads the
      # toolchain from (`@stable`), so the toolchain is stated explicitly.
      # `rust-toolchain.toml` pins the same channel and the components.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: "rustfmt, clippy"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p velocity-code-cli --features fault-injection --test crash_consistency
      - run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      - run: cargo build --release
      # Invoked via `bash <script>` rather than as an executable: the gate
      # then runs whatever is in the file regardless of whether the
      # execute bit survived the checkout (a mode change dropped by a
      # patch, a `core.fileMode=false` clone, a future non-POSIX runner).
      # A gate that can be silently skipped by a file-mode change is not a
      # gate.
      # Each harness's stdout is captured under harness/out/ for the run
      # artifact below. `set -o pipefail` keeps the tee from masking the
      # harness's exit code — a gate whose failure a pipe can swallow is
      # not a gate.
      - name: T9a stale-write gate
        run: |
          set -o pipefail
          mkdir -p harness/out
          PATH="$PWD/target/release:$PATH" bash harness/t9a/run.sh 100 2>&1 | tee harness/out/t9a.txt
      - name: R1 lexical parity
        run: |
          set -o pipefail
          mkdir -p harness/out
          PATH="$PWD/target/release:$PATH" bash harness/r/r1_lexical.sh 2>&1 | tee harness/out/r1_lexical.txt
      - name: R1 definitions (Rust)
        run: |
          set -o pipefail
          mkdir -p harness/out
          PATH="$PWD/target/release:$PATH" bash harness/r/r1_defs.sh 2>&1 | tee harness/out/r1_defs.txt
      # Uploaded on failure too: a red run's outputs are the ones worth
      # reading. Pinned by SHA for the same reason as the actions above.
      - name: Upload harness outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-outputs
          path: |
            harness/out/
            harness/t9a/results-*.jsonl
          if-no-files-found: warn
