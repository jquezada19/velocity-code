name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p velocity-code-cli --features fault-injection --test crash_consistency
      - run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      - run: cargo build --release
      - name: R1 lexical parity
        run: PATH="$PWD/target/release:$PATH" harness/r/r1_lexical.sh
      - name: R1 definitions (Rust)
        run: PATH="$PWD/target/release:$PATH" harness/r/r1_defs.sh
